<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>專案沙盒設定</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; color: #e7e7ec; background: #17171c; }
      main { width: min(100%, 480px); margin: 0 auto; padding: 24px; }
      h1 { margin: 0 0 6px; font-size: 21px; }
      .risk-label { display: inline-block; margin-bottom: 14px; padding: 3px 8px; border: 1px solid #9b6b31; border-radius: 999px; color: #ffd38a; font-size: 11px; }
      .note { margin: 0 0 18px; color: #aaaab5; font-size: 12px; line-height: 1.55; }
      .card { padding: 16px; border: 1px solid #363640; border-radius: 12px; background: #202027; }
      label { display: block; margin-bottom: 13px; color: #c9c9d2; font-size: 13px; }
      label > span { display: block; margin-bottom: 6px; }
      select, button { width: 100%; min-height: 36px; border: 1px solid #484853; border-radius: 8px; color: #efeff4; background: #2b2b33; font: inherit; }
      select { padding: 0 9px; }
      button { cursor: pointer; }
      button:hover { background: #383843; }
      button:disabled { cursor: wait; opacity: 0.55; }
      .pet-select { margin-bottom: 16px; }
      .path-label { margin: 14px 0 5px; color: #92929e; font-size: 11px; }
      code { display: block; padding: 8px 9px; border-radius: 7px; color: #b8b8e8; background: #18181d; overflow-wrap: anywhere; user-select: text; }
      code.empty { color: #777783; }
      #choose-workspace { margin: 8px 0 14px; }
      .toggle { display: flex; align-items: center; gap: 8px; }
      .toggle input { accent-color: #6d64d8; }
      .warning { margin: 8px 0 13px; padding: 9px 10px; border: 1px solid rgba(240,164,60,.38); border-radius: 8px; color: #ffd38a; background: rgba(194,120,24,.13); font-size: 12px; }
      #apply { margin-top: 16px; border-color: #675bd0; background: #5147b8; }
      #apply:hover { background: #6156ca; }
      .status { min-height: 20px; margin-top: 9px; color: #aaaab5; font-size: 12px; user-select: text; }
      .status.success { color: #78d6a0; }
      .status.error { color: #ff8c96; }
      .status.warning { color: #ffd38a; }
    </style>
  </head>
  <body>
    <main>
      <h1>專案沙盒設定</h1>
      <span class="risk-label">進階・高風險設定</span>
      <p class="note">這是獨立的安全設定視窗，不屬於一般桌寵設定。套用時由桌寵主程序直接修改工作目錄中的 <code>.codex/config.toml</code>，不會交給 AI 或執行任意腳本。</p>
      <div class="card">
        <label class="pet-select"><span>寵物／專案</span><select id="pet-select"></select></label>
        <div class="path-label">工作目錄</div>
        <code id="workspace-path" class="empty">尚未選擇工作目錄</code>
        <button id="choose-workspace">選擇工作目錄…</button>
        <label><span>核准策略</span>
          <select id="approval-policy">
            <option value="on-request">需要時詢問（建議）</option>
            <option value="untrusted">只自動允許受信任操作</option>
            <option value="never">永不詢問（受限操作直接失敗）</option>
          </select>
        </label>
        <label><span>沙盒模式</span>
          <select id="sandbox-mode">
            <option value="workspace-write">可寫工作目錄（建議）</option>
            <option value="read-only">唯讀</option>
            <option value="danger-full-access">完整存取（高風險）</option>
          </select>
        </label>
        <label class="toggle"><input type="checkbox" id="network-access" />允許工作區沙盒連線網路（例如 git push）</label>
        <div class="warning" id="danger-warning" hidden>完整存取會移除一般檔案與網路沙盒限制。只應用於你完全信任的專案。</div>
        <div class="path-label">設定檔</div>
        <code id="config-path">選擇工作目錄後顯示</code>
        <button id="apply">套用到專案</button>
        <div class="status" id="status" role="status"></div>
      </div>
    </main>
    <script type="module" src="./sandboxSettings.ts"></script>
  </body>
</html>
