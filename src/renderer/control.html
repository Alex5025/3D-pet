<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="window.control">中控面板</title>
    <link rel="stylesheet" href="./tokens.css" />
    <style>
      :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; color: var(--text-1); background: var(--bg-app); overflow-x: auto; }
      main { min-width: 680px; max-width: 1100px; margin: 0 auto; padding: 20px 24px 28px; }
      h1 { margin: 0; font-size: 21px; }
      h2 { margin: 22px 0 8px; font-size: 14px; color: var(--text-2); }
      h2 .count { color: var(--text-3); font-weight: normal; }
      .topbar { display: flex; align-items: center; gap: 10px; }
      .topbar .spacer { flex: 1; }
      .topbar #ui-locale { min-height: 30px; width: auto; }
      button { min-height: 30px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 8px; color: var(--text-1); background: var(--bg-card); font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
      button:hover { background: var(--bg-hover); }
      button:disabled { cursor: not-allowed; opacity: 0.5; }
      button.danger { border-color: var(--err); color: var(--err); }
      button.danger:hover { background: var(--err-soft); }
      input[type="text"], textarea, select { border: 1px solid var(--border); border-radius: 8px; color: var(--text-1); background: var(--bg-inset); font: inherit; font-size: 13px; }
      input[type="text"] { min-height: 30px; padding: 0 9px; width: 100%; }
      input[type="text"]:disabled { opacity: 0.45; }
      textarea { width: 100%; min-height: 56px; padding: 8px 10px; resize: vertical; }
      select { min-height: 32px; padding: 0 8px; }
      .empty-note { color: var(--text-3); font-size: 12px; padding: 8px 0; }

      /* ── 寵物列 ── */
      .pet-rows { display: flex; flex-direction: column; gap: 6px; }
      .pet-row { display: grid; grid-template-columns: minmax(110px, 150px) minmax(84px, 110px) auto auto minmax(100px, 1fr) minmax(200px, 280px); gap: 8px; align-items: center; padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-card); }
      .pet-row.resting { opacity: 0.55; }
      .pet-name-cell { display: flex; align-items: center; gap: 7px; min-width: 0; }
      /* 名稱本身是按鈕(點一下就地改名),外觀維持純文字 */
      .pet-name {
        padding: 2px 4px; margin: -2px -4px; font-weight: 600; font-size: 13px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        color: inherit; font-family: inherit; text-align: left;
        background: none; border: 0; border-radius: 6px; cursor: text;
      }
      .pet-name:hover { background: var(--bg-hover); }
      .pet-name-edit {
        padding: 2px 4px; margin: -2px -4px; min-width: 0; width: 100%;
        font: inherit; font-weight: 600; font-size: 13px; color: var(--text-1);
        background: var(--bg-inset); border: 1px solid var(--accent); border-radius: 6px; outline: none;
      }
      .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; }
      .dot.resting { background: var(--border-strong); }
      .dot.idle { background: var(--text-3); }
      .dot.working { background: var(--ok); box-shadow: 0 0 6px var(--ok-soft); }
      .dot.awaitingApproval { background: var(--warn); box-shadow: 0 0 6px var(--warn-soft); }
      .pet-workspace { color: var(--text-3); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .pet-toggle { min-height: 26px; padding: 0 10px; font-size: 12px; }
      .pet-status { min-width: 0; font-size: 12px; color: var(--text-2); }
      .pet-status .queue-count { color: var(--text-3); margin-left: 6px; }
      .pet-input-cell { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
      .pet-input-line { display: flex; gap: 6px; }
      .pet-input-line button { min-height: 30px; padding: 0 10px; font-size: 12px; flex: none; }
      .pet-feedback { min-height: 0; font-size: 11px; color: var(--text-2); }
      .pet-feedback.error { color: var(--err); }
      .pet-feedback.success { color: var(--ok); }
      .pet-more { display: flex; gap: 4px; }
      .pet-more button { min-height: 26px; padding: 0 8px; font-size: 11px; color: var(--text-2); white-space: nowrap; }
      /* 審批列(等審批時出現在該寵列下方) */
      .approval-row { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding: 7px 9px; border: 1px solid var(--warn); border-radius: 8px; background: var(--warn-soft); }
      .approval-desc { flex: 1; margin: 0; color: var(--warn); font-size: 12px; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: text; }
      .approval-row .allow { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); min-height: 26px; font-size: 12px; }
      .approval-row .allow:hover { background: var(--bg-hover); }
      .approval-row .deny { border-color: var(--err); color: var(--err); background: transparent; min-height: 26px; font-size: 12px; }
      .approval-row .deny:hover { background: var(--err-soft); }

      /* ── 公用任務發佈 ── */
      .publish-card { padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-card); }
      .publish-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
      .publish-row select { flex: 1; }
      .publish-row button { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
      .publish-row button:hover { background: var(--accent-hover); }
      .publish-feedback { min-height: 16px; margin-top: 6px; font-size: 12px; color: var(--text-2); }
      .publish-feedback.error { color: var(--err); }
      .publish-feedback.success { color: var(--ok); }
      .publish-hint { margin-top: 4px; color: var(--text-3); font-size: 11px; }
      #workspace-root { display: block; margin-top: 8px; padding: 6px 8px; border-radius: 8px; background: var(--bg-inset); color: var(--text-2); font-size: 12px; overflow-wrap: anywhere; }

      /* ── 任務帳本 ── */
      .task-table { border: 1px solid var(--border); border-radius: 12px; background: var(--bg-card); overflow: hidden; }
      .task-row { display: grid; grid-template-columns: 76px minmax(160px, 1fr) minmax(90px, 130px) minmax(90px, 130px) 64px 30px; gap: 8px; align-items: center; padding: 7px 12px; border-top: 1px solid var(--border); font-size: 12px; }
      .task-row:first-child { border-top: 0; }
      .task-row.header { color: var(--text-3); font-size: 11px; background: var(--bg-inset); }
      .task-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-1); user-select: text; }
      .task-cell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); }
      .task-time { color: var(--text-3); font-variant-numeric: tabular-nums; }
      .status-badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; text-align: center; }
      .status-badge.queued { color: var(--text-2); background: var(--bg-hover); }
      .status-badge.running { color: var(--ok); background: var(--ok-soft); }
      .status-badge.done { color: var(--info); background: var(--info-soft); }
      .status-badge.failed { color: var(--err); background: var(--err-soft); }
      .status-badge.removed { color: var(--text-3); background: var(--bg-hover); }
      .task-remove { min-height: 22px; padding: 0 7px; font-size: 11px; }

      /* ── 分頁 ── */
      #tabs { display: flex; gap: 6px; margin-top: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
      #tabs button { border: 0; background: transparent; color: var(--text-2); font-size: 13px; padding: 4px 10px; border-radius: 7px; }
      #tabs button:hover { color: var(--text-1); background: var(--bg-hover); }
      #tabs button.active { color: var(--text-1); background: var(--accent-soft); }
      .tab { display: none; }
      .tab.active { display: block; }

      /* ── 沙盒設定分頁(逐寵直列,不折疊) ── */
      .sandbox-rows { display: flex; flex-direction: column; gap: 6px; }
      .sandbox-row { display: grid; grid-template-columns: minmax(110px, 150px) minmax(84px, 110px) minmax(150px, 1fr) minmax(140px, 1fr) auto auto; gap: 8px; align-items: center; padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-card); }
      .sandbox-row.no-workspace { opacity: 0.55; }
      .sandbox-row select { min-height: 30px; font-size: 12px; }
      .toggle { display: flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 12px; white-space: nowrap; }
      .toggle input { accent-color: var(--accent); }
      .sandbox-apply { border-color: var(--accent); background: var(--accent); color: var(--on-accent); min-height: 28px; font-size: 12px; }
      .sandbox-apply:hover { background: var(--accent-hover); }
      .sandbox-status { grid-column: 1 / -1; min-height: 0; color: var(--text-2); font-size: 11px; user-select: text; overflow-wrap: anywhere; }
      .sandbox-status.success { color: var(--ok); }
      .sandbox-status.error { color: var(--err); }
      .sandbox-status.warning { color: var(--warn); }
      .risk-label { display: inline-block; margin: 0 0 10px; padding: 3px 8px; border: 1px solid var(--warn); border-radius: 999px; color: var(--warn); font-size: 11px; }
      .sandbox-note { margin: 0 0 14px; color: var(--text-2); font-size: 12px; line-height: 1.55; }
      .sandbox-note code { padding: 1px 5px; border-radius: 5px; color: var(--accent); background: var(--bg-inset); }
    </style>
  </head>
  <body>
    <main>
      <div class="topbar">
        <h1 data-i18n="window.control">中控面板</h1>
        <div class="spacer"></div>
        <select id="ui-locale" title="介面語言" data-i18n-title="settings.globalLocale">
          <option value="" data-i18n="settings.localeSystem">跟隨系統</option>
          <option value="zh-Hant">繁體中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
        </select>
        <button id="system-restart" data-i18n="tray.restartSystem">重啟寵物系統</button>
        <button id="system-quit" class="danger" data-i18n="tray.quit">結束</button>
      </div>

      <div id="tabs">
        <button data-tab="overview" class="active" data-i18n="control.tabOverview">總覽</button>
        <button data-tab="global" data-i18n="control.tabGlobal">全域設定</button>
        <button data-tab="sandbox" data-i18n="control.tabSandbox">沙盒設定</button>
      </div>

      <div class="tab active" id="tab-overview">
      <h2><span data-i18n="control.awakePets">清醒的寵物</span> <span class="count" id="awake-count"></span></h2>
      <div class="pet-rows" id="awake-rows"></div>

      <h2><span data-i18n="control.restingPets">休息的寵物</span> <span class="count" id="resting-count"></span></h2>
      <div class="pet-rows" id="resting-rows"></div>

      <h2 data-i18n="control.publish">公用任務發佈</h2>
      <div class="publish-card">
        <textarea id="publish-text" maxlength="1000" data-i18n-placeholder="control.publishPlaceholder" placeholder="輸入公用任務…空閒的寵物會自動領取"></textarea>
        <div class="publish-row">
          <select id="publish-workspace"></select>
          <button id="publish-send" data-i18n="control.publishBtn">發佈</button>
        </div>
        <div class="publish-hint" data-i18n="control.publishHint">限定工作區 = 指定運行路徑:只有該工作區的寵物會領這張單,並在該目錄執行。</div>
        <div class="publish-feedback" id="publish-feedback" role="status"></div>
      </div>

      <h2 data-i18n="control.tasks">任務佇列與狀態</h2>
      <div class="task-table" id="task-table"></div>
      </div>

      <!-- 全域設定:不屬於任何一隻寵物,獨立分頁才不會跟逐寵的操作混在一起 -->
      <div class="tab" id="tab-global">
        <h2 data-i18n="settings.globalWorkspaceRoot">全域：新寵物預設位置</h2>
        <div class="publish-card">
          <div class="publish-hint" data-i18n="settings.workspaceRootNote">新增寵物時會自動在此根目錄下建立「寵物名_時間」資料夾（只影響之後新增的寵物）</div>
          <code id="workspace-root" data-i18n="common.loading">載入中…</code>
          <div class="publish-row">
            <button id="change-workspace-root" data-i18n="settings.change">變更…</button>
          </div>
        </div>
      </div>

      <div class="tab" id="tab-sandbox">
        <h2 data-i18n="control.sandboxHeading">沙盒設定（逐寵）</h2>
        <span class="risk-label" data-i18n="control.riskLabel">進階・高風險設定</span>
        <p class="sandbox-note" data-i18n="control.sandboxNote">這是進階的安全設定，不屬於一般桌寵設定。套用時由桌寵主程序直接修改該寵工作目錄中的 .codex/config.toml，不會交給 AI 或執行任意腳本。完整存取會移除一般檔案與網路沙盒限制，只應用於你完全信任的專案。</p>
        <div class="sandbox-rows" id="sandbox-rows"></div>
      </div>
    </main>
    <script type="module" src="./control.ts"></script>
  </body>
</html>
