<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>燈光設定</title>
    <style>
      html, body {
        margin: 0;
        background: #1c1c20;
        color: #f2f2f4;
        font: 400 13px/1.6 system-ui, -apple-system, "Noto Sans TC", sans-serif;
        user-select: none;
      }
      #panel { padding: 16px 18px; }
      .row { margin-bottom: 12px; }
      .row label { display: flex; justify-content: space-between; margin-bottom: 2px; color: #c9c9d2; }
      .row .val { font-variant-numeric: tabular-nums; color: #8f8fd9; }
      input[type='range'] { width: 100%; accent-color: #6d64d8; }
      button {
        width: 100%;
        margin-top: 4px;
        padding: 7px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.07);
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button:hover { background: rgba(255, 255, 255, 0.12); }
    </style>
  </head>
  <body>
    <div id="panel">
      <div class="row">
        <label>環境光強度 <span class="val" id="ambient-val"></span></label>
        <input type="range" id="ambient" min="0" max="6.2832" step="0.02" />
      </div>
      <div class="row">
        <label>方向光強度 <span class="val" id="directional-val"></span></label>
        <input type="range" id="directional" min="0" max="6.2832" step="0.02" />
      </div>
      <div class="row">
        <label>方向光方向 X(左右) <span class="val" id="dirX-val"></span></label>
        <input type="range" id="dirX" min="-1" max="1" step="0.02" />
      </div>
      <div class="row">
        <label>方向光方向 Y(上下) <span class="val" id="dirY-val"></span></label>
        <input type="range" id="dirY" min="-1" max="1" step="0.02" />
      </div>
      <button id="reset">重置為預設</button>
    </div>
    <script type="module" src="./settings.ts"></script>
  </body>
</html>
