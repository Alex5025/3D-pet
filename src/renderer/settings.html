<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>燈光與位置設定</title>
    <style>
      html, body {
        margin: 0;
        background: #1c1c20;
        color: #f2f2f4;
        font: 400 13px/1.6 system-ui, -apple-system, "Noto Sans TC", sans-serif;
        user-select: none;
      }
      #panel { padding: 14px 16px 18px; }
      h3 { margin: 10px 0 6px; font-size: 13px; color: #a9a9e6; font-weight: 600; }
      .row { margin-bottom: 10px; }
      .row label { display: flex; justify-content: space-between; margin-bottom: 2px; color: #c9c9d2; }
      .val { font-variant-numeric: tabular-nums; color: #8f8fd9; }
      input[type='range'] { width: 100%; accent-color: #6d64d8; }

      .pads { display: flex; gap: 12px; }
      .pad-box { flex: 1; }
      .pad-box .cap { display: flex; justify-content: space-between; color: #c9c9d2; margin-bottom: 3px; }
      .pad {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        background: #26262c;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        cursor: crosshair;
        touch-action: none;
      }
      .pad::before, .pad::after {
        content: '';
        position: absolute;
        background: rgba(255, 255, 255, 0.07);
      }
      .pad::before { left: 50%; top: 0; bottom: 0; width: 1px; }
      .pad::after { top: 50%; left: 0; right: 0; height: 1px; }
      /* 座標軸顏色(3D 慣例):X 紅、Y 綠、Z 藍。::after = 橫線、::before = 直線 */
      .pad.hx::after { background: rgba(255, 99, 99, 0.55); }
      .pad.hz::after { background: rgba(96, 148, 255, 0.55); }
      .pad.vy::before { background: rgba(88, 214, 128, 0.55); }
      .pad.vz::before { background: rgba(96, 148, 255, 0.55); }
      .ax-x { color: #ff6363; }
      .ax-y { color: #58d680; }
      .ax-z { color: #6094ff; }
      /* 原點(0,0,0)= 角色 */
      .origin {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-size: 38px;
        pointer-events: none;
        filter: grayscale(0.2);
        opacity: 0.9;
        text-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
      }
      /* 側視圖:角色面朝 +Z(墊的右側)。emoji 側面圖預設朝左,鏡像成朝右 */
      .origin-side { transform: translate(-50%, -50%) scaleX(-1); }
      .dot {
        position: absolute;
        width: 12px;
        height: 12px;
        margin: -6px 0 0 -6px;
        border-radius: 50%;
        background: #6d64d8;
        box-shadow: 0 0 6px rgba(109, 100, 216, 0.9);
        pointer-events: none;
      }
      button {
        width: 100%;
        margin-top: 10px;
        padding: 7px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.07);
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button:hover { background: rgba(255, 255, 255, 0.12); }
    </style>
  </head>
  <body>
    <div id="panel">
      <h3>光源強度</h3>
      <div class="row">
        <label>環境光 <span class="val" id="ambient-val"></span></label>
        <input type="range" id="ambient" min="0" max="6.2832" step="0.02" />
      </div>
      <div class="row">
        <label>方向光 <span class="val" id="directional-val"></span></label>
        <input type="range" id="directional" min="0" max="6.2832" step="0.02" />
      </div>
      <div class="row">
        <label>陰影濃度(立體感) <span class="val" id="shade-val"></span></label>
        <input type="range" id="shade" min="0" max="1" step="0.01" />
      </div>

      <h3>光源位置(相對角色)</h3>
      <div class="pads">
        <div class="pad-box">
          <div class="cap"><span><b class="ax-x">X</b><b class="ax-z">Z</b>(俯視,下=朝你)</span><span class="val" id="lxz-val"></span></div>
          <div class="pad hx vz" id="light-xz"><span class="origin">🧍‍♀️</span><div class="dot"></div></div>
        </div>
        <div class="pad-box">
          <div class="cap"><span><b class="ax-y">Y</b><b class="ax-z">Z</b>(側視,右=朝你)</span><span class="val" id="lyz-val"></span></div>
          <div class="pad hz vy" id="light-yz"><span class="origin origin-side">🚶‍♀️</span><div class="dot"></div></div>
        </div>
      </div>

      <h3>角色位置</h3>
      <div class="pads">
        <div class="pad-box">
          <div class="cap"><span><b class="ax-x">X</b><b class="ax-y">Y</b>(正面)</span><span class="val" id="pxy-val"></span></div>
          <div class="pad hx vy" id="pet-xy"><div class="dot"></div></div>
        </div>
        <div class="pad-box">
          <div class="cap"><span><b class="ax-z">Z</b><b class="ax-y">Y</b>(側面)</span><span class="val" id="pzy-val"></span></div>
          <div class="pad hz vy" id="pet-zy"><div class="dot"></div></div>
        </div>
      </div>

      <button id="reset">全部重置為預設</button>
    </div>
    <script type="module" src="./settings.ts"></script>
  </body>
</html>
