<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>設定</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #1c1c20;
        color: #f2f2f4;
        font: 400 13px/1.6 system-ui, -apple-system, "Noto Sans TC", sans-serif;
        user-select: none;
        overflow-y: auto;
      }
      #panel { padding: 12px 16px 18px; }

      /* 寵物管理 */
      #pet-toolbar { display: flex; gap: 7px; margin-bottom: 10px; }
      #pet-select, .text-input {
        box-sizing: border-box;
        min-width: 0;
        padding: 7px 9px;
        color: #eeeeF4;
        background: #28282e;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        font: inherit;
        outline: none;
      }
      #pet-select { flex: 1; }
      #pet-toolbar button {
        width: 36px;
        color: #eeeef4;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        font: 600 17px/1 system-ui;
        cursor: pointer;
      }
      #pet-toolbar button:hover { background: rgba(255, 255, 255, 0.12); }
      #pet-toolbar button[disabled] { opacity: 0.45; cursor: default; }

      /* 分頁 */
      #tabs { display: flex; gap: 6px; margin-bottom: 12px; }
      #tabs button {
        flex: 1;
        padding: 7px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.05);
        color: #c9c9d2;
        font: inherit;
        cursor: pointer;
      }
      #tabs button.active { background: #4f46c8; border-color: #4f46c8; color: #fff; }
      #ltype { display: flex; gap: 6px; }
      #ltype button {
        flex: 1;
        padding: 6px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.05);
        color: #c9c9d2;
        font: inherit;
        cursor: pointer;
      }
      #ltype button.active { background: #4f46c8; border-color: #4f46c8; color: #fff; }
      .tab { display: none; }
      .tab.active { display: block; }

      h3 { margin: 10px 0 6px; font-size: 13px; color: #a9a9e6; font-weight: 600; }
      .row { margin-bottom: 10px; }
      .row label { display: flex; justify-content: space-between; margin-bottom: 2px; color: #c9c9d2; }
      .val { font-variant-numeric: tabular-nums; color: #8f8fd9; }
      input[type='range'] { width: 100%; accent-color: #6d64d8; }

      .pads { display: flex; gap: 12px; }
      .pad-box { flex: 1; }
      .pad-box .cap {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 6px;
        color: #c9c9d2;
        margin-bottom: 3px;
        font-size: 12px;
        white-space: nowrap; /* 標題不因數值寬度換行 */
      }
      /* 數值預留固定寬度(容得下 "-100.0, -100.0")+ 靠右 + 等寬數字,位數變化不re排版 */
      .pad-box .cap .val { min-width: 104px; text-align: right; }
      .pad {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        background: #26262c;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        cursor: crosshair;
        touch-action: none;
      }
      .pad::before, .pad::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.07); }
      .pad::before { left: 50%; top: 0; bottom: 0; width: 1px; }
      .pad::after { top: 50%; left: 0; right: 0; height: 1px; }
      .pad.hx::after { background: rgba(255, 99, 99, 0.55); }
      .pad.hz::after { background: rgba(96, 148, 255, 0.55); }
      .pad.vy::before { background: rgba(88, 214, 128, 0.55); }
      .pad.vz::before { background: rgba(96, 148, 255, 0.55); }
      .ax-x { color: #ff6363; }
      .ax-y { color: #58d680; }
      .ax-z { color: #6094ff; }
      .origin {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-size: 38px;
        pointer-events: none;
        filter: grayscale(0.2);
        opacity: 0.9;
        text-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
      }
      .origin-side { transform: translate(-50%, -50%) scaleX(-1); }
      .origin img { width: 68px; display: block; }
      .dot {
        position: absolute;
        width: 12px;
        height: 12px;
        margin: -6px 0 0 -6px;
        border-radius: 50%;
        background: #6d64d8;
        box-shadow: 0 0 6px rgba(109, 100, 216, 0.9);
        pointer-events: none;
      }

      /* 服裝清單 */
      #wardrobe { display: flex; flex-direction: column; gap: 4px; }
      #wardrobe label {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 8px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.04);
        cursor: pointer;
      }
      #wardrobe input { accent-color: #6d64d8; }
      #wardrobe .empty { color: #6f6f7a; }

      button.wide {
        width: 100%;
        margin-top: 12px;
        padding: 7px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.07);
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button.wide:hover { background: rgba(255, 255, 255, 0.12); }

      /* 工作設定 */
      .project-note { margin: 0 0 12px; color: #a9a9b3; }
      .workspace-card {
        padding: 14px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.04);
      }
      .workspace-label { margin-bottom: 5px; color: #c9c9d2; font-size: 12px; }
      .field { display: block; margin-bottom: 11px; color: #c9c9d2; }
      .field > span { display: block; margin-bottom: 4px; font-size: 12px; }
      .text-input { width: 100%; user-select: text; }
      .toggle-field { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; color: #c9c9d2; }
      .toggle-field input { accent-color: #6d64d8; }
      #workspace-path {
        display: block;
        box-sizing: border-box;
        width: 100%;
        min-height: 52px;
        padding: 9px 10px;
        color: #dedee8;
        background: #151519;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow-wrap: anywhere;
        user-select: text;
      }
      #workspace-path.empty { color: #777783; }
      #change-workspace[disabled] { opacity: 0.55; cursor: wait; }
    </style>
  </head>
  <body>
    <div id="panel">
      <div id="pet-toolbar">
        <select id="pet-select" aria-label="目前寵物"></select>
        <button id="add-pet" title="新增寵物" aria-label="新增寵物">＋</button>
        <button id="remove-pet" title="移除寵物" aria-label="移除寵物">−</button>
      </div>
      <div id="tabs">
        <button data-tab="light" class="active">光影</button>
        <button data-tab="char">角色</button>
        <button data-tab="project">工作</button>
      </div>

      <!-- ── 光影 ── -->
      <div class="tab active" id="tab-light">
        <h3>光源類型</h3>
        <div id="ltype">
          <button data-t="directional" class="active">平行光(太陽)</button>
          <button data-t="point">點光源(燈泡)</button>
        </div>

        <h3>光源強度</h3>
        <div class="row">
          <label>環境光 <span class="val" id="ambient-val"></span></label>
          <input type="range" id="ambient" min="0" max="6.2832" step="0.02" />
        </div>
        <div class="row">
          <label>方向光 <span class="val" id="directional-val"></span></label>
          <input type="range" id="directional" min="0" max="6.2832" step="0.02" />
        </div>
        <div class="row">
          <label>陰影濃度(立體感) <span class="val" id="shade-val"></span></label>
          <input type="range" id="shade" min="0" max="1" step="0.01" />
        </div>

        <h3>光源位置(相對角色)</h3>
        <div class="pads">
          <div class="pad-box">
            <div class="cap"><span><b class="ax-x">X</b><b class="ax-y">Y</b>(正面)</span><span class="val" id="lxy-val"></span></div>
            <div class="pad hx vy" id="light-xy"><span class="origin" id="origin-xz">🧍‍♀️</span><div class="dot"></div></div>
          </div>
          <div class="pad-box">
            <div class="cap"><span><b class="ax-y">Y</b><b class="ax-z">Z</b>(側視,右=朝你)</span><span class="val" id="lyz-val"></span></div>
            <div class="pad hz vy" id="light-yz"><span class="origin origin-side" id="origin-yz">🚶‍♀️</span><div class="dot"></div></div>
          </div>
        </div>
      </div>

      <!-- ── 角色 ── -->
      <div class="tab" id="tab-char">
        <h3>晃動強度(1 = 模型原廠)</h3>
        <div class="row">
          <label>頭髮 <span class="val" id="hair-val"></span></label>
          <input type="range" id="hair" min="0" max="2" step="0.02" />
        </div>
        <div class="row">
          <label>衣服 <span class="val" id="cloth-val"></span></label>
          <input type="range" id="cloth" min="0" max="2" step="0.02" />
        </div>
        <div class="row">
          <label>胸部 <span class="val" id="chest-val"></span></label>
          <input type="range" id="chest" min="0" max="2" step="0.02" />
        </div>
        <div class="row">
          <label>尾巴 <span class="val" id="tail-val"></span></label>
          <input type="range" id="tail" min="0" max="2" step="0.02" />
        </div>

        <h3>服裝顯示</h3>
        <div id="wardrobe"><span class="empty">載入中…</span></div>

        <h3>角色位置</h3>
        <div class="pads">
          <div class="pad-box">
            <div class="cap"><span><b class="ax-x">X</b><b class="ax-y">Y</b>(正面)</span><span class="val" id="pxy-val"></span></div>
            <div class="pad hx vy" id="pet-xy"><div class="dot"></div></div>
          </div>
          <div class="pad-box">
            <div class="cap"><span><b class="ax-z">Z</b><b class="ax-y">Y</b>(側面)</span><span class="val" id="pzy-val"></span></div>
            <div class="pad hz vy" id="pet-zy"><div class="dot"></div></div>
          </div>
        </div>
      </div>

      <!-- ── 工作設定 ── -->
      <div class="tab" id="tab-project">
        <h3>工作設定</h3>
        <p class="project-note">每隻寵物可分別連結工作目錄與 AI 助手（Codex / Claude Code）。切換寵物不會自動開啟瀏覽視窗。</p>
        <div class="workspace-card">
          <label class="field">
            <span>寵物名稱</span>
            <input class="text-input" id="pet-name" type="text" maxlength="40" placeholder="例如：小粉" />
          </label>
          <label class="field">
            <span>AI 助手</span>
            <select class="text-input" id="agent-kind">
              <option value="codex">Codex</option>
              <option value="claude">Claude Code</option>
            </select>
          </label>
          <label class="field">
            <span>模型（空 = CLI 全域預設）</span>
            <input class="text-input" id="agent-model" type="text" maxlength="80" placeholder="例如：gpt-5.6-sol / claude-fable-5 / opus" spellcheck="false" />
          </label>
          <label class="field">
            <span>推理力度</span>
            <select class="text-input" id="agent-effort">
              <option value="">預設</option>
              <option value="low">low</option>
              <option value="medium">medium</option>
              <option value="high">high</option>
              <option value="xhigh">xhigh</option>
              <option value="max">max（僅 Claude）</option>
            </select>
          </label>
          <label class="field">
            <span>Session ID（對話後自動回存；手動填寫為進階用途）</span>
            <input class="text-input" id="agent-session-id" type="text" maxlength="160" placeholder="例如：019f…" spellcheck="false" />
          </label>
          <label class="toggle-field">
            <input id="pet-enabled" type="checkbox" />
            啟用這隻寵物（取消後會休息並釋放資源）
          </label>
          <div class="workspace-label">工作目錄</div>
          <code id="workspace-path" class="empty">尚未選擇工作目錄</code>
          <button class="wide" id="change-workspace">選擇工作目錄…</button>
        </div>
      </div>

      <button class="wide" id="reset">全部重置為預設</button>
    </div>
    <script type="module" src="./settings.ts"></script>
  </body>
</html>
